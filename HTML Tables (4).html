<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>Table</title>
</head>

<body>

<table border="1" cellspacing="0" cellpadding="8" width="80%">
    <!-- ردیف اول -->
    <tr>
        <th>Table Heading</th>
        <th>Table Heading</th>
        <th>Table Heading</th>
    </tr>

    <!-- ردیف دوم -->
    <tr>
        <td>Table Data</td>
        <td>Table Data</td>
        <td>Table Data</td>
    </tr>

    <!-- بخش اصلی -->
    <tr>
        <td rowspan="1">Table Data</td>

        <td>
            Table Data

            <!-- جدول داخلی -->
            <table border="1" cellspacing="0" cellpadding="8" width="100%">
                <tr>
                    <th>Table Heading</th>
                    <th>Table Heading</th>
                    <th>Table Heading</th>
                </tr>

                <tr>
                    <td>Table Data</td>
                    <td>Table Data</td>
                    <td>Table Data</td>
                </tr>

                <tr>
                    <td>Table Data</td>
                    <td>Table Data</td>
                    <td>Table Data</td>
                </tr>

                <tr>
                    <td>Table Data</td>
                    <td>Table Data</td>
                    <td>Table Data</td>
                </tr>
            </table>
        </td>

        <td>Table Data</td>
    </tr>

    <!-- ردیف آخر -->
    <tr>
        <td>Table Data</td>
        <td>Table Data</td>
        <td>Table Data</td>
    </tr>
</table>

</body>
</html>
