<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal and Vertical Alignment</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <h1>Horizontal and Vertical Alignment</h1>

        <div class="content">

            <div class="header">
                Cell Alignment With CSS
            </div>

            <div class="main">

                <div class="examples">
                    Examples
                </div>

                <div class="nested-area">

                    <div class="nested-table">

                        <table>
                            <thead>
                                <tr>
                                    <th>Row</th>
                                    <th>Cell-1</th>
                                    <th>Cell-2</th>
                                    <th>Cell-3</th>
                                </tr>
                            </thead>

                            <tbody>

                                <tr>
                                    <td class="row-number">3</td>

                                    <td class="top left">
                                        CSS
                                    </td>

                                    <td class="middle left">
                                        CSS
                                    </td>

                                    <td class="bottom left">
                                        CSS
                                    </td>
                                </tr>

                                <tr>
                                    <td class="row-number">4</td>

                                    <td class="top center">
                                        CSS
                                    </td>

                                    <td class="middle center">
                                        CSS
                                    </td>

                                    <td class="bottom center">
                                        CSS
                                    </td>
                                </tr>

                                <tr>
                                    <td class="row-number">5</td>

                                    <td class="top right">
                                        CSS
                                    </td>

                                    <td class="middle right">
                                        CSS
                                    </td>

                                    <td class="bottom right">
                                        CSS
                                    </td>
                                </tr>

                            </tbody>
                        </table>

                    </div>

                    <div class="nested-title">
                        Nested Table
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
