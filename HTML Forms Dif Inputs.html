<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <h1>Registration Form</h1>

    <form action="#" method="post">

        <label>First Name :</label>
        <input type="text" placeholder="Enter First Name">
        <br><br>

        <label>Last Name :</label>
        <input type="text" placeholder="Enter Last Name">
        <br><br>

        <label>Email :</label>
        <input type="email" placeholder="Enter Email Address">
        <br><br>

        <label>Password :</label>
        <input type="password">
        <br><br>

        <label>Gender:</label>
        <br>

        <input type="radio" id="male" name="gender">
        <label for="male">Male</label>
        <br>

        <input type="radio" id="female" name="gender">
        <label for="female">Female</label>
        <br>

        <input type="radio" id="other" name="gender">
        <label for="other">Other</label>

        <br><br>

        <label>Age :</label>
        <input type="number">
        <br><br>

        <label>Preferences :</label>
        <br>

        <input type="checkbox" id="acrylic">
        <label for="acrylic">Acrylic Painting</label>
        <br>

        <input type="checkbox" id="oil">
        <label for="oil">Oil Painting</label>
        <br>

        <input type="checkbox" id="water">
        <label for="water">Water Color Painting</label>

        <br><br>

        <label>Select Occupation</label>

        <select>
            <option>Student</option>
            <option>Teacher</option>
            <option>Engineer</option>
            <option>Doctor</option>
            <option>Business</option>
        </select>

        <br><br>

        <label>Bio</label><br>

        <textarea rows="8" cols="50" placeholder="Share few lines about yourself..."></textarea>

        <br><br>

        <input type="reset" value="RESET">
        <input type="submit" value="SUBMIT">

    </form>

</body>
</html>
